<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML v9</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 50px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background-color: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        p { font-size: 16px; color: #555; line-height: 1.5; }
        .version { display: inline-block; padding: 8px 16px; background-color: #3498db; color: white; border-radius: 20px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Chào mừng!</h1>
        <p>Đây là file HTML được tạo theo yêu cầu của bạn.</p>
        <div class="version">Phiên bản: v9</div>
    </div>
</body>
</html>
